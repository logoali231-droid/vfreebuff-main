<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Sign in — VFreeBuff</title>
<style>
  :root {
    --bg: #0e1512; --panel: #16211c; --line: #26382f; --text: #d9e6df;
    --muted: #8aa296; --accent: #4ade80; --error: #f87171;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(1000px 500px at 50% -10%, #17302566, transparent), var(--bg);
    color: var(--text); font-family: var(--sans); padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 28px 26px;
    box-shadow: 0 20px 60px #00000066;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .brand svg { width: 26px; height: 26px; }
  h1 { font-size: 1.15rem; margin: 0; letter-spacing: .2px; }
  .tag { color: var(--muted); font-size: .82rem; margin: 0 0 22px; line-height: 1.5; }
  label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 12px; font-size: .95rem; font-family: var(--mono);
    color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 9px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: 16px; padding: 11px 12px; font-size: .95rem; font-weight: 600;
    color: #06130c; background: var(--accent); border: 0; border-radius: 9px; cursor: pointer;
  }
  button:hover { filter: brightness(1.06); }
  button:disabled { opacity: .6; cursor: wait; }
  .err { color: var(--error); font-size: .82rem; min-height: 1.2em; margin-top: 12px; }
  .foot { color: var(--muted); font-size: .72rem; margin-top: 18px; text-align: center; }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" rx="5" stroke="#4ade80" stroke-width="2"/>
        <path d="M7 8h4v4H7zM13 8h4v4h-4zM7 14h4v4H7zM13 14h4v2h-4z" fill="#4ade80"/>
      </svg>
      <h1>VFreeBuff</h1>
    </div>
    <p class="tag">Free AI Minecraft modpack builder.<br />This instance is private — enter the password to continue.</p>

    <form id="form" autocomplete="current-password">
      <label for="pw">Password</label>
      <input id="pw" name="password" type="password" placeholder="••••••••" autofocus />
      <button id="go" type="submit">Sign in</button>
    </form>
    <p class="err" id="err" role="alert"></p>
    <p class="foot">Your Minecraft. Your rules. Your modpack. Free.</p>
  </main>

<script>
  const form = document.getElementById('form');
  const pw = document.getElementById('pw');
  const go = document.getElementById('go');
  const err = document.getElementById('err');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    go.disabled = true;
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: pw.value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        err.textContent = data.error || `Sign-in failed (HTTP ${res.status})`;
        pw.value = ''; pw.focus();
        return;
      }
      location.replace('/');
    } catch {
      err.textContent = 'Network error — is the server running?';
    } finally {
      go.disabled = false;
    }
  });
</script>
</body>
</html>
